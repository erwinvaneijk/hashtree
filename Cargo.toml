[package]
name = "hashtree-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hashtree"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = true }
clap = { version = "4.5", features = ["derive"] }
digest = "0.10"
hex = "0.4"
md-5 = "0.10"
md2 = "0.10"
path-clean = "1.0"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
