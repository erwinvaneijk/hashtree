[package]
name = "hashtree-rs"
version = "3.0.1"
edition = "2024"
license = "EUPL-1.2"

[[bin]]
name = "hashtree"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = true }
clap = { version = "4.5", features = ["derive"] }
digest = "0.10"
filetime = "0.2"
hex = "0.4"
md-5 = "0.10"
path-clean = "1.0"
rayon = "1.10"
ripemd = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2.0"
uuid = { version = "1.28", features = ["v4"] }
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"
